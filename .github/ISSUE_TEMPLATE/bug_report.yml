name: Bug report
description: Something in Relay does not work as expected.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.
        **Do not report security vulnerabilities here.** See [SECURITY.md](https://github.com/marekbdzoch/relay/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open channel ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Relay version
      description: Shown at `/api/health`, or the image tag / git commit you run.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How do you run Relay?
      options:
        - Docker Compose (bundled Caddy)
        - Docker behind my own reverse proxy
        - From source (npm run dev / npm start)
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Messages / threads / reactions
        - Channels / DMs / sidebar
        - Files / uploads
        - Search
        - Huddles (calls, video, screen share)
        - Notifications / unreads / activity
        - AI agents
        - Slack bridge
        - Webhooks / API
        - Admin / invites / accounts
        - Mobile layout
        - Desktop / mobile shell
        - Deployment / Docker
        - Translations
        - Other
  - type: input
    id: client
    attributes:
      label: Browser and OS
      placeholder: Firefox 140 on macOS 26, Chrome on Android 16, ...
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server logs (`docker compose logs relay`) and/or browser console output. Remove any secrets or personal data.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, configuration (without secrets), related issues.
