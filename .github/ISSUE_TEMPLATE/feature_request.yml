name: Feature request
description: Suggest an idea or improvement for Relay.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas and questions, consider starting a Discussion first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Mock-ups and references to other tools are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - "Yes, I'd like to open a pull request"
        - Maybe, with some guidance
        - No
